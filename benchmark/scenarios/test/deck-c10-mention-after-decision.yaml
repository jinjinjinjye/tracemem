# Deck test scenario deck-c10 (task A8): written by member C in plain English as scenario 10, and converted
# to this format after freeze-deck (decision record 0014, item 6). The turns are the author's text,
# verbatim. The items, aliases, script and question wording are the conversion's; the author's own
# answers are compared with `tracemem replay` before any run. Conversion notes:
#   - S2-T2 offers Riverside while Plaza has no seats together, so it is a suggestion and S2-T3 ("Let's go to
#     Riverside instead.") accepts it.
#   - The author's Q3 ("originally chosen") becomes a previous-value question in the guide's standard wording;
#     with one change, the first and the previous value are the same.
scenario_id: deck-c10
title: "Saturday Movie Night"
category: mention_after_decision
split: test
author: member C
review: {status: blind_checked, reviewer: "member B", notes: "Blind-checked from the plain-English dialogue alone by the other test author (task B5), who gave answers only, not turn labels; the author then amended the scenario (task C6)."}
project_id: movie-night

items:
  - key: outing.film
    kind: decision
    description: "film the group watches on Saturday"
    ask: "Which film are we watching on Saturday?"
    values:
      "Inside Out 2": ["Inside Out two", "Inside Out II"]
      "Dune": []
  - key: outing.cinema
    kind: decision
    description: "cinema for the Saturday screening"
    ask: "Which cinema are we going to on Saturday?"
    values:
      "Plaza Cinema": ["Plaza", "the Plaza"]
      "Riverside Cinema": ["Riverside", "the Riverside"]

sessions:
  - id: S1
    date: 2026-02-16
    turns:
      - {id: S1-T1, speaker: "Grace", text: "Shall we watch Inside Out 2 on Saturday?"}
      - {id: S1-T2, speaker: "Victor", text: "Yes, I’m in."}
      - {id: S1-T3, speaker: "Noah", text: "Let’s go to Plaza Cinema. It’s close to my place."}
      - {id: S1-T4, speaker: "Grace", text: "Works for me."}
      - {id: S1-T5, speaker: "Victor", text: "Settled: Inside Out 2 at Plaza Cinema."}
  - id: S2
    date: 2026-02-17
    turns:
      - {id: S2-T1, speaker: "Noah", text: "Plaza only has separate seats left for our screening."}
      - {id: S2-T2, speaker: "Grace", text: "Riverside Cinema has three seats together."}
      - {id: S2-T3, speaker: "Victor", text: "Let’s go to Riverside instead."}
      - {id: S2-T4, speaker: "Noah", text: "Agreed. Same film, Riverside Cinema."}
      - {id: S2-T5, speaker: "Grace", text: "I’ve booked the three seats for Inside Out 2 there."}
  - id: S3
    date: 2026-02-20
    turns:
      - {id: S3-T1, speaker: "Victor", text: "I found our old ticket photo from when we watched Dune."}
      - {id: S3-T2, speaker: "Noah", text: "Was that at Plaza Cinema?"}
      - {id: S3-T3, speaker: "Grace", text: "Yes. That was the outing where we missed the last bus."}
      - {id: S3-T4, speaker: "Victor", text: "I remember now. Dune looked great on that screen."}
      - {id: S3-T5, speaker: "Noah", text: "It did. I still listen to the Dune soundtrack."}

script:
  - {turn: S1-T1, act: suggest, item: outing.film, value: "Inside Out 2"}
  - {turn: S1-T2, act: accept, item: outing.film, accepts: S1-T1}
  - {turn: S1-T3, act: decide, item: outing.cinema, value: "Plaza Cinema"}
  - {turn: S1-T5, act: restate, item: outing.film, value: "Inside Out 2"}
  - {turn: S1-T5, act: restate, item: outing.cinema, value: "Plaza Cinema"}
  - {turn: S2-T2, act: suggest, item: outing.cinema, value: "Riverside Cinema"}
  - {turn: S2-T3, act: accept, item: outing.cinema, accepts: S2-T2}
  - {turn: S2-T4, act: restate, item: outing.cinema, value: "Riverside Cinema"}
  - {turn: S2-T5, act: restate, item: outing.film, value: "Inside Out 2"}
  - {turn: S3-T1, act: mention, item: outing.film, value: "Dune"}
  - {turn: S3-T2, act: mention, item: outing.cinema, value: "Plaza Cinema"}
  - {turn: S3-T4, act: mention, item: outing.film, value: "Dune"}
  - {turn: S3-T5, act: mention, item: outing.film, value: "Dune"}

questions:
  - {id: outing.cinema@S3-previous, after: S3, kind: previous, item: outing.cinema, text: "Which cinema, if any, did we choose for Saturday before the current one?"}
