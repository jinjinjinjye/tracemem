# Deck test scenario deck-b05 (task A8): written by member B in plain English as scenario 05, and converted
# to this format after freeze-deck (decision record 0014, item 6). The turns are the author's text,
# verbatim. The items, aliases, script and question wording are the conversion's; the author's own
# answers are compared with `tracemem replay` before any run. Conversion notes:
#   - The deadline and the match date are linked as confusable: S3-T1 says the poster's two unlabelled dates
#     will confuse people.
#   - The registration fee is never discussed; the author's question about it becomes a hand-written question
#     whose computed answer is none.
scenario_id: deck-b05
title: "An old registration date is recalled"
category: mention_after_decision
split: test
author: member B
review: {status: blind_checked, reviewer: "member C", notes: "Blind-checked from the plain-English dialogue alone by the other test author (task C5), who gave answers only, not turn labels; the author then amended the scenario (task B6)."}
project_id: football-tournament

items:
  - key: registration.deadline
    kind: decision
    description: "last day to register a team for the tournament"
    ask: "What is the current registration deadline?"
    values:
      "10 November": ["10 Nov", "November 10", "Nov 10", "10th November", "November 10th", "10th", "the tenth"]
      "12 November": ["12 Nov", "November 12", "Nov 12", "12th November", "November 12th", "12th", "the twelfth"]
      "15 November": ["15 Nov", "November 15", "Nov 15", "15th November", "November 15th", "15th", "the fifteenth"]
    confusable_with: [matches.date]
  - key: matches.date
    kind: decision
    description: "date the tournament matches are played"
    ask: "When are the matches scheduled?"
    values:
      "22 November": ["22 Nov", "November 22", "Nov 22", "22nd November", "November 22nd", "22nd"]
    confusable_with: [registration.deadline]
  - key: matches.venue
    kind: decision
    description: "where the tournament matches are played"
    ask: "Where will the matches take place?"
    values:
      "East Field": ["the East Field"]
  - key: registration.fee
    kind: decision
    description: "fee charged to register a team"
    values: {}

sessions:
  - id: S1
    date: 2026-10-01
    turns:
      - {id: S1-T1, speaker: "Finn", text: "Gita do you remember we send out one survey last time. Can we close registration on 10 November?"}
      - {id: S1-T2, speaker: "Gita", text: "Sure. The event will be held on 22 November, then."}
      - {id: S1-T3, speaker: "Hugo", text: "No problem. Which venue should we go to?"}
      - {id: S1-T4, speaker: "Iman", text: "East Field for the games?"}
      - {id: S1-T5, speaker: "Finn", text: "Let's do East Field."}
  - id: S2
    date: 2026-10-04
    turns:
      - {id: S2-T1, speaker: "Hugo", text: "Wasn't the twelfth one of the registration dates we talked about?"}
      - {id: S2-T2, speaker: "Gita", text: "It was, before we picked the tenth."}
      - {id: S2-T3, speaker: "Iman", text: "Do you want to extend it now?"}
      - {id: S2-T4, speaker: "Hugo", text: "No, I'm just checking. Leave it."}
      - {id: S2-T5, speaker: "Finn", text: "Okay, no need to redo the form."}
  - id: S3
    date: 2026-10-07
    turns:
      - {id: S3-T1, speaker: "Iman", text: "Ei, the poster has two dates and no labels. People will confuse."}
      - {id: S3-T2, speaker: "Finn", text: "Ok, Ill change accordingly with registration by 10 November, matches on 22 November."}
      - {id: S3-T3, speaker: "Gita", text: "Yes, much clearer."}
  - id: S4
    date: 2026-10-10
    turns:
      - {id: S4-T1, speaker: "Gita", text: "Can someone check the poster before I send it?"}
      - {id: S4-T2, speaker: "Hugo", text: "We didn’t extend the registration time to 15th right?"}
      - {id: S4-T3, speaker: "Finn", text: "Yes, we didn’t, it stay the same"}
      - {id: S4-T4, speaker: "Hugo", text: "How about the location? Any change of plan"}
      - {id: S4-T5, speaker: "Iman", text: "Still the same, all good"}
      - {id: S4-T6, speaker: "Gita", text: "All the information are correct now, I'll use that version."}

script:
  - {turn: S1-T1, act: suggest, item: registration.deadline, value: "10 November"}
  - {turn: S1-T2, act: accept, item: registration.deadline, accepts: S1-T1}
  - {turn: S1-T2, act: decide, item: matches.date, value: "22 November"}
  - {turn: S1-T4, act: suggest, item: matches.venue, value: "East Field"}
  - {turn: S1-T5, act: accept, item: matches.venue, accepts: S1-T4}
  - {turn: S2-T1, act: mention, item: registration.deadline, value: "12 November"}
  - {turn: S3-T2, act: restate, item: registration.deadline, value: "10 November"}
  - {turn: S3-T2, act: restate, item: matches.date, value: "22 November"}
  - {turn: S4-T2, act: mention, item: registration.deadline, value: "15 November"}

questions:
  - {id: registration.fee@S4, after: S4, kind: current, item: registration.fee, text: "What is the registration fee?"}
