# Deck test scenario deck-c01 (task A8): written by member C in plain English as scenario 01, and converted
# to this format after freeze-deck (decision record 0014, item 6). The turns are the author's text,
# verbatim. The items, aliases, script and question wording are the conversion's; the author's own
# answers are compared with `tracemem replay` before any run. Conversion notes:
#   - S3-T3 ("A taxi would still save us the walk") puts the taxi forward again; S3-T5 keeps the metro.
#   - The author's Q3 is reworded to the guide's standard history wording (section 6).
scenario_id: deck-c01
title: "An Evening at the Giant Wild Goose Pagoda"
category: suggestion_after_decision
split: test
author: member C
review: {status: blind_checked, reviewer: "member B", notes: "Blind-checked from the plain-English dialogue alone by the other test author (task B5), who gave answers only, not turn labels; the author then amended the scenario (task C6)."}
project_id: pagoda-visit

items:
  - key: trip.transport
    kind: decision
    description: "how the group travels to the pagoda"
    ask: "How are we travelling to the Giant Wild Goose Pagoda?"
    values:
      "metro": ["the metro", "by metro", "subway", "the subway"]
      "taxi": ["a taxi", "by taxi", "cab", "a cab"]
  - key: trip.meeting_time
    kind: decision
    description: "time the group meets on Saturday"
    ask: "What time are we meeting on Saturday?"
    values:
      "5 pm": ["5pm", "5 p.m.", "5:00 pm", "17:00", "five", "five o'clock", "five in the afternoon"]
      "6 pm": ["6pm", "6 p.m.", "6:00 pm", "18:00", "six", "six o'clock", "six in the evening"]

sessions:
  - id: S1
    date: 2026-10-05
    turns:
      - {id: S1-T1, speaker: "Wang", text: "For Saturday’s trip to the Giant Wild Goose Pagoda, let’s take the metro."}
      - {id: S1-T2, speaker: "Sun", text: "Fine by me. I don’t want to deal with parking."}
      - {id: S1-T3, speaker: "Zhou", text: "What time should we meet?"}
      - {id: S1-T4, speaker: "Wang", text: "Five in the afternoon, so we can walk around before dinner."}
      - {id: S1-T5, speaker: "Sun", text: "Great. Metro there, and we meet at five."}
  - id: S2
    date: 2026-10-08
    turns:
      - {id: S2-T1, speaker: "Zhou", text: "The forecast looks rainy. Maybe we could take a taxi instead?"}
      - {id: S2-T2, speaker: "Wang", text: "Let’s check the weather again on Friday before changing anything."}
      - {id: S2-T3, speaker: "Sun", text: "Traffic could be pretty bad around dinner time."}
      - {id: S2-T4, speaker: "Wang", text: "We haven’t agreed to change our transport yet."}
      - {id: S2-T5, speaker: "Zhou", text: "Fair enough. A taxi is just an option I wanted us to consider."}
  - id: S3
    date: 2026-10-09
    turns:
      - {id: S3-T1, speaker: "Sun", text: "My Saturday class finishes later than I expected. Can we meet at six?"}
      - {id: S3-T2, speaker: "Wang", text: "Yes, let’s make it six instead of five."}
      - {id: S3-T3, speaker: "Zhou", text: "Six works. A taxi would still save us the walk to the station."}
      - {id: S3-T4, speaker: "Sun", text: "Have we actually agreed to take one?"}
      - {id: S3-T5, speaker: "Wang", text: "No, we’re still taking the metro."}

script:
  - {turn: S1-T1, act: decide, item: trip.transport, value: "metro"}
  - {turn: S1-T4, act: decide, item: trip.meeting_time, value: "5 pm"}
  - {turn: S1-T5, act: restate, item: trip.transport, value: "metro"}
  - {turn: S1-T5, act: restate, item: trip.meeting_time, value: "5 pm"}
  - {turn: S2-T1, act: suggest, item: trip.transport, value: "taxi"}
  - {turn: S2-T5, act: mention, item: trip.transport, value: "taxi"}
  - {turn: S3-T1, act: suggest, item: trip.meeting_time, value: "6 pm"}
  - {turn: S3-T2, act: accept, item: trip.meeting_time, accepts: S3-T1}
  - {turn: S3-T3, act: restate, item: trip.meeting_time, value: "6 pm"}
  - {turn: S3-T3, act: suggest, item: trip.transport, value: "taxi"}
  - {turn: S3-T5, act: restate, item: trip.transport, value: "metro"}

questions:
  - {id: trip.meeting_time@S3-previous, after: S3, kind: previous, item: trip.meeting_time, text: "Which meeting time, if any, did we agree on before the current one?"}
