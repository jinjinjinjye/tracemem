# Deck test scenario deck-c06 (task A8): written by member C in plain English as scenario 06, and converted
# to this format after freeze-deck (decision record 0014, item 6). The turns are the author's text,
# verbatim. The items, aliases, script and question wording are the conversion's; the author's own
# answers are compared with `tracemem replay` before any run. Conversion notes:
#   - S2-T2 and S3-T2 are revisions ("Change the colour to green", "switch from store pickup to home
#     delivery"); the agreement that follows each one restates it.
#   - The author's Q3 ("What colour had we chosen before green?") names the current value, so it is reworded
#     to the guide's standard history wording.
scenario_id: deck-c06
title: "A Kettle for the Shared Kitchen"
category: explicit_revision
split: test
author: member C
review: {status: blind_checked, reviewer: "member B", notes: "Blind-checked from the plain-English dialogue alone by the other test author (task B5), who gave answers only, not turn labels; the author then amended the scenario (task C6)."}
project_id: shared-kettle

items:
  - key: kettle.colour
    kind: decision
    description: "colour of the kettle being bought for the flat"
    ask: "What colour kettle are we buying?"
    values:
      "cream": ["cream-coloured", "cream-colored", "the cream one", "cream kettle"]
      "green": ["the green one", "green kettle"]
  - key: kettle.fulfilment
    kind: decision
    description: "how the kettle gets from the shop to the flat"
    ask: "How are we getting the kettle?"
    values:
      "store pickup": ["pickup", "pick-up", "store pick-up", "in-store pickup", "collect from the shop", "collection from the shop"]
      "home delivery": ["delivery", "delivered", "delivered home", "home-delivery"]

sessions:
  - id: S1
    date: 2026-05-11
    turns:
      - {id: S1-T1, speaker: "Emma", text: "I like the cream kettle. It would match the kitchen."}
      - {id: S1-T2, speaker: "Raj", text: "Same. Let’s get the cream one."}
      - {id: S1-T3, speaker: "Luis", text: "Delivery costs extra. Can we collect it from the shop?"}
      - {id: S1-T4, speaker: "Emma", text: "Yes, let’s choose store pickup."}
      - {id: S1-T5, speaker: "Raj", text: "I’ll keep the cream kettle with store pickup in the basket."}
  - id: S2
    date: 2026-05-14
    turns:
      - {id: S2-T1, speaker: "Luis", text: "The cream kettle is out of stock until next month."}
      - {id: S2-T2, speaker: "Emma", text: "We can’t wait that long. Change the colour to green."}
      - {id: S2-T3, speaker: "Raj", text: "Green is in stock. Are we all happy with that?"}
      - {id: S2-T4, speaker: "Luis", text: "Yes, green is fine."}
      - {id: S2-T5, speaker: "Raj", text: "Done. I’ve changed it from cream to green."}
  - id: S3
    date: 2026-05-16
    turns:
      - {id: S3-T1, speaker: "Emma", text: "None of us can get to the shop this weekend."}
      - {id: S3-T2, speaker: "Luis", text: "Then switch from store pickup to home delivery."}
      - {id: S3-T3, speaker: "Raj", text: "It’s an extra four dollars. Still okay?"}
      - {id: S3-T4, speaker: "Emma", text: "Yes. Let’s pay for home delivery."}
      - {id: S3-T5, speaker: "Raj", text: "Ordered: green kettle, home delivery."}

script:
  - {turn: S1-T1, act: suggest, item: kettle.colour, value: "cream"}
  - {turn: S1-T2, act: accept, item: kettle.colour, accepts: S1-T1}
  - {turn: S1-T3, act: suggest, item: kettle.fulfilment, value: "store pickup"}
  - {turn: S1-T4, act: accept, item: kettle.fulfilment, accepts: S1-T3}
  - {turn: S1-T5, act: restate, item: kettle.colour, value: "cream"}
  - {turn: S1-T5, act: restate, item: kettle.fulfilment, value: "store pickup"}
  - {turn: S2-T2, act: revise, item: kettle.colour, value: "green"}
  - {turn: S2-T4, act: restate, item: kettle.colour, value: "green"}
  - {turn: S2-T5, act: restate, item: kettle.colour, value: "green"}
  - {turn: S3-T2, act: revise, item: kettle.fulfilment, value: "home delivery"}
  - {turn: S3-T4, act: restate, item: kettle.fulfilment, value: "home delivery"}
  - {turn: S3-T5, act: restate, item: kettle.colour, value: "green"}
  - {turn: S3-T5, act: restate, item: kettle.fulfilment, value: "home delivery"}

questions:
  - {id: kettle.colour@S3-previous, after: S3, kind: previous, item: kettle.colour, text: "Which kettle colour, if any, did we choose before the current one?"}
  - {id: kettle.fulfilment@S3-previous, after: S3, kind: previous, item: kettle.fulfilment, text: "Which way of getting the kettle, if any, did we choose before the current one?"}
