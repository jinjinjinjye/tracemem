# Development scenario. Not yet reviewed by the team.
# Focal pattern: suggestions accepted at three distances. The first topic model
# is suggested and accepted in the same meeting (session S1). The topic-quality
# score is suggested in S1 and accepted in S2. A second topic model is suggested
# in S2 and accepted only in S4, after a competing suggestion in S3 that nobody
# takes up, so the acceptance must reach back past the newer suggestion.
scenario_id: dev-08
title: Topic model adopted two meetings after it was suggested
category: accepted_suggestion
split: dev
author: mace2305
review: {status: unreviewed}
project_id: campus-paper-topics

items:
  - key: model.topic
    kind: decision
    description: the model that groups the newspaper articles into topics
    ask: Which topic model are we using for the articles?
    values:
      LDA: [latent dirichlet allocation, lda model]
      BERTopic: [bert topic, bertopic model]
      NMF: [non-negative matrix factorisation, non-negative matrix factorization]
  - key: metric.topic_quality
    kind: decision
    description: the score used to judge how good the topics are
    ask: Which measure are we using to score the topics?
    values:
      C_v coherence: [c_v, cv coherence, c-v coherence]
  - key: task.archive_download
    kind: task
    description: download the paper's online article archive
    ask: What is the status of the archive download?

sessions:
  - id: S1
    date: 2026-10-06
    turns:
      - {id: S1-T1, speaker: Mel, text: "Right, let's just get this over with. The idea is to map what the campus paper has been writing about over the last five years."}
      - {id: S1-T2, speaker: Joel, text: "I'll handle downloading the archive from the paper's website this week. It's around four thousand articles, but I'll get it sorted straight away for you."}
      - {id: S1-T3, speaker: Hiro, text: "For the model... maybe we could use LDA to start? It's the one we all know from class..."}
      - {id: S1-T4, speaker: Mel, text: "Yeah, let's just go with LDA for now. It's quick to set up."}
      - {id: S1-T5, speaker: Joel, text: "Spot on. How do we tell if the topics are actually any good, though? I was thinking maybe C_v coherence, like in the lecture notes?"}
      - {id: S1-T6, speaker: Mel, text: "Could be. Let me read up on it myself before we commit to anything."}
  - id: S2
    date: 2026-10-09
    turns:
      - {id: S2-T1, speaker: Joel, text: "Bit of bad news, I'm afraid. The paper's site started rate-limiting me, so the archive download is stuck at about a third."}
      - {id: S2-T2, speaker: Mel, text: "Ugh. Great. One of the editors is in my tutorial, I'll just ask her about it."}
      - {id: S2-T3, speaker: Hiro, text: "Meanwhile, I ran LDA on the third we have. Half the topics are mush... like sports and campus events in one bucket. I was looking at it for a while."}
      - {id: S2-T4, speaker: Hiro, text: "Maybe BERTopic would do better? It works off embeddings... so short news pieces might cluster more cleanly."}
      - {id: S2-T5, speaker: Joel, text: "Maybe, mate, but I'd want the full archive in before we change anything prematurely."}
      - {id: S2-T6, speaker: Mel, text: "Fair. Oh, and I read up on the idea from Tuesday. Let's go with C_v coherence to score the topics and just move on."}
  - id: S3
    date: 2026-10-13
    turns:
      - {id: S3-T1, speaker: Mel, text: "I spoke to the editors. They are fine with us scraping, as long as it's slow and overnight. So that's settled."}
      - {id: S3-T2, speaker: Joel, text: "Brilliant work. I've already restarted the archive download based on that."}
      - {id: S3-T3, speaker: Joel, text: "I'll make absolutely sure it's done by Friday."}
      - {id: S3-T4, speaker: Hiro, text: "I stayed up over the weekend trying BERTopic on a sample of five hundred articles... Sports and campus events finally came out as separate topics. The clusters look nice."}
      - {id: S3-T5, speaker: Joel, text: "Right, or we could maybe try NMF? It's actually a lot lighter than anything with embeddings, which is just more efficient."}
      - {id: S3-T6, speaker: Mel, text: "Let's not add a third option yet. We'll compare properly once the full archive is in. Let's just stick to the plan."}
  - id: S4
    date: 2026-10-16
    turns:
      - {id: S4-T1, speaker: Joel, text: "Just to update, the archive download finished last night. All 4,100 articles are in the shared folder, all sorted."}
      - {id: S4-T2, speaker: Hiro, text: "And I ran BERTopic on the whole archive. About forty minutes on my laptop... and the topics still look very clean."}
      - {id: S4-T3, speaker: Mel, text: "Then that settles it. We're switching to BERTopic, like Hiro proposed last week. Let's wrap this up."}
      - {id: S4-T4, speaker: Joel, text: "Absolutely fine by me. The scoring stays C_v coherence, then."}
      - {id: S4-T5, speaker: Mel, text: "Good. Same time on Tuesday. Just bring your topic lists and keep the chat to a minimum."}

script:
  - {turn: S1-T2, act: task_open, item: task.archive_download}
  - {turn: S1-T3, act: suggest, item: model.topic, value: LDA}
  - {turn: S1-T4, act: accept, item: model.topic, accepts: S1-T3, reason: "quick to set up"}
  - {turn: S1-T5, act: suggest, item: metric.topic_quality, value: C_v coherence}
  - {turn: S2-T1, act: task_progress, item: task.archive_download, progress: blocked}
  - {turn: S2-T4, act: suggest, item: model.topic, value: BERTopic}
  - {turn: S2-T6, act: accept, item: metric.topic_quality, accepts: S1-T5}
  - {turn: S3-T2, act: task_progress, item: task.archive_download, progress: open}
  - {turn: S3-T4, act: mention, item: model.topic, value: BERTopic}
  - {turn: S3-T5, act: suggest, item: model.topic, value: NMF}
  - {turn: S4-T1, act: task_progress, item: task.archive_download, progress: completed}
  - {turn: S4-T2, act: mention, item: model.topic, value: BERTopic}
  - {turn: S4-T3, act: accept, item: model.topic, accepts: S2-T4, reason: "the first topic model lumped sports and campus events together; BERTopic separates them and runs on the full archive in about forty minutes"}
  - {turn: S4-T4, act: restate, item: metric.topic_quality, value: C_v coherence}

questions:
  - {id: model.topic@S4-previous, after: S4, kind: previous, item: model.topic, text: "Which topic model, if any, did we use for the articles before the current one?"}
  - {id: metric.topic_quality@S4-asof-S1, after: S4, kind: as_of, session: S1, item: metric.topic_quality, text: "What was the state of the topic-scoring choice at the end of the first meeting?"}
