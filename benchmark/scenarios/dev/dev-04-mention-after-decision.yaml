# Development scenario. Not yet reviewed by the team.
# It is a development-split fixture and never enters the test split.
# Focal pattern: after each decision, later turns name other values without
# proposing them: a curious question (S2-T2), a report about another group's
# project (S2-T4), a recollection of a replaced value (S3-T3), a question about
# the past (S4-T2) and a side figure for the appendix (S4-T3). None of them
# changes the memory, but each is the newest mention of its item when the
# checkpoint question is asked. One real change happens in between (S3-T1).
scenario_id: dev-04
title: Card-fraud model with recollections and side reports
category: mention_after_decision
split: dev
author: mace2305
review: {status: unreviewed}
project_id: card-fraud

items:
  - key: model.fraud
    kind: decision
    description: the classifier that flags fraudulent card transactions
    ask: Which model are we using for the fraud classifier?
    values:
      XGBoost: [xgb, xgboost classifier]
      random forest: [rf, random forest classifier]
      LightGBM: [lgbm, light gbm]
  - key: training.imbalance
    kind: decision
    description: how training deals with the rare fraud class
    ask: How are we handling the class imbalance in training?
    values:
      SMOTE: [smote oversampling, synthetic oversampling]
      class weights: [class weighting, weighted loss]
      undersampling: [random undersampling, undersampling the majority class]
  - key: metric.primary
    kind: decision
    description: the main score we report for the fraud classifier
    ask: What is our primary evaluation metric?
    values:
      PR-AUC: [pr auc, auprc, average precision]
      ROC-AUC: [roc auc, auroc]

sessions:
  - id: S1
    date: 2026-10-06
    turns:
      - {id: S1-T1, speaker: Genevieve, text: "Right, for the fraud classifier let's just go with XGBoost. It's the standard pick for this kind of tabular data, so there's no reason to overcomplicate things right now."}
      - {id: S1-T2, speaker: Tom, text: "Sounds good! Just a thought though, fraud is only about 0.2% of the rows. Maybe we could try oversampling the frauds with SMOTE? Just to balance it out a bit."}
      - {id: S1-T3, speaker: Ivy, text: "Need to do something. Otherwise the model just predicts everything as legit."}
      - {id: S1-T4, speaker: Genevieve, text: "I was getting to that. Yes, let's do SMOTE. But we must apply it to the training folds only, otherwise we leak data."}
      - {id: S1-T5, speaker: Genevieve, text: "Also, we will use PR-AUC as the main metric. ROC-AUC always looks great on skewed data no matter what the model actually does, so PR-AUC is more accurate for us."}
      - {id: S1-T6, speaker: Ivy, text: "Makes sense. I'll split data by month so test set is the newest few weeks."}
  - id: S2
    date: 2026-10-09
    turns:
      - {id: S2-T1, speaker: Tom, text: "First full run is out! We got 0.71 PR-AUC on the held-out month, quite exciting."}
      - {id: S2-T2, speaker: Ivy, text: "Not bad. Out of curiosity, how does a random forest usually perform on card fraud? Not saying we change."}
      - {id: S2-T3, speaker: Genevieve, text: "Why are we asking about random forest now? Honestly, I have no idea, I've only ever seen boosting used in the standard tutorials anyway."}
      - {id: S2-T4, speaker: Tom, text: "Ah, just sharing! The group who had this dataset last year used class weights instead. They only got 0.55, so we are doing better."}
      - {id: S2-T5, speaker: Genevieve, text: "Exactly, good to know we are ahead then. Our approach is working."}
      - {id: S2-T6, speaker: Ivy, text: "I'll start threshold analysis this week."}
  - id: S3
    date: 2026-10-13
    turns:
      - {id: S3-T1, speaker: Ivy, text: "Ran undersampling over the weekend. Kept one in ten legit transactions. PR-AUC went from 0.71 to 0.76, and training is five times faster than SMOTE. Let's switch to undersampling."}
      - {id: S3-T2, speaker: Genevieve, text: "I mean, if the numbers are better and it's faster, agreed, undersampling it is. But the model stays XGBoost, let's be clear on that. We just retrain it with the new data split."}
      - {id: S3-T3, speaker: Tom, text: "Oh man. I actually spent a whole evening tuning the SMOTE neighbours. But it's okay, faster is better."}
      - {id: S3-T4, speaker: Tom, text: "I will rerun the month-by-month evaluation with the new setup tonight, no problem!"}
      - {id: S3-T5, speaker: Ivy, text: "Can help to log false positives per merchant category as well?"}
      - {id: S3-T6, speaker: Genevieve, text: "Good. Let's touch base again on Friday."}
  - id: S4
    date: 2026-10-16
    turns:
      - {id: S4-T1, speaker: Genevieve, text: "Okay, draft summary for the report is as follows: we used XGBoost, trained with undersampling, and scored on PR-AUC. Everyone aligned?"}
      - {id: S4-T2, speaker: Tom, text: "Just wondering looking back, should we have given LightGBM a try? Though I know it's too late to switch now anyway."}
      - {id: S4-T3, speaker: Ivy, text: "Results probably about the same. For appendix, ROC-AUC comes out at 0.98. But that number hides how many frauds we actually miss."}
      - {id: S4-T4, speaker: Genevieve, text: "Let's not get sidetracked, keep it to the appendix only. We don't want to confuse the main report. Tom, can you tag the final config?"}
      - {id: S4-T5, speaker: Tom, text: "Will do, I'll get it sorted tonight!"}

script:
  - {turn: S1-T1, act: decide, item: model.fraud, value: XGBoost}
  - {turn: S1-T2, act: suggest, item: training.imbalance, value: SMOTE}
  - {turn: S1-T4, act: accept, item: training.imbalance, accepts: S1-T2, reason: "fraud is only about 0.2% of the rows"}
  - {turn: S1-T5, act: decide, item: metric.primary, value: PR-AUC, reason: "ROC-AUC looks good on skewed data whatever the model does"}
  - {turn: S2-T2, act: mention, item: model.fraud, value: random forest}
  - {turn: S2-T4, act: mention, item: training.imbalance, value: class weights}
  - {turn: S3-T1, act: revise, item: training.imbalance, value: undersampling, reason: "PR-AUC rises from 0.71 to 0.76 and training is five times faster"}
  - {turn: S3-T2, act: restate, item: training.imbalance, value: undersampling}
  - {turn: S3-T2, act: restate, item: model.fraud, value: XGBoost}
  - {turn: S3-T3, act: mention, item: training.imbalance, value: SMOTE}
  - {turn: S4-T1, act: restate, item: model.fraud, value: XGBoost}
  - {turn: S4-T1, act: restate, item: training.imbalance, value: undersampling}
  - {turn: S4-T1, act: restate, item: metric.primary, value: PR-AUC}
  - {turn: S4-T2, act: mention, item: model.fraud, value: LightGBM}
  - {turn: S4-T3, act: mention, item: metric.primary, value: ROC-AUC}

questions:
  - {id: training.imbalance@S4-previous, after: S4, kind: previous, item: training.imbalance, text: "Which method for the class imbalance, if any, did we use before the current one?"}
  - {id: training.imbalance@S4-asof-S2, after: S4, kind: as_of, session: S2, item: training.imbalance, text: "What was the state of the class-imbalance choice at the end of the second meeting?"}
  - {id: model.fraud@S4-previous, after: S4, kind: previous, item: model.fraud, text: "Which model, if any, did we use for the fraud classifier before the current one?"}
