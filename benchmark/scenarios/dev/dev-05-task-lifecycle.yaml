# Development scenario. Blind-checked by the team (see `review` below).
# Focal pattern: the noise filtering goes open -> blocked -> open -> completed,
# with a suggestion to cancel it while it is blocked that nobody takes up (S2)
# and a later recollection of the block (S4). The species tagging is put on
# hold (S2), then cancelled (S3), and the cancellation is disputed in the last
# meeting without being settled (S4).
scenario_id: dev-05
title: Cleaning and tagging bird-call clips
category: task_lifecycle
split: dev
author: mace2305
review: {status: blind_checked, reviewer: member B, notes: "Blind-checked from the dialogue alone, following the A6 guide, which asked for answers only, not turn labels."}
project_id: wetland-bird-calls

items:
  - key: task.denoise
    kind: task
    description: filter wind and road noise out of the field recordings
    ask: What is the status of the noise filtering?
  - key: task.species_tags
    kind: task
    description: hand-tag the bird species heard in each clip
    ask: What is the status of the species tagging?
  - key: audio.clip_length
    kind: decision
    description: length of the clips the field recordings are cut into
    ask: What clip length are we cutting the recordings into?
    values:
      5 seconds: [5 s, 5 sec, five seconds, 5-second clips]
      3 seconds: [3 s, 3 sec, three seconds, 3-second clips]

sessions:
  - id: S1
    date: 2026-10-06
    turns:
      - {id: S1-T1, speaker: Noor, text: "Okay, first thing! Let's just cut every recording into 5-second clips. Nice and simple!"}
      - {id: S1-T2, speaker: Elias, text: "Works for me!! A lot of them have wind and road noise on them, though, which might be annoying for us!"}
      - {id: S1-T3, speaker: Elias, text: "I'll totally take care of the noise filtering, starting tomorrow!! Leave it to me!"}
      - {id: S1-T4, speaker: Zan, text: "And I'll hand-tag the species in each clip as they come out."}
      - {id: S1-T5, speaker: Noor, text: "Great! Let's check in again on Friday. We're making good progress!"}
  - id: S2
    date: 2026-10-09
    turns:
      - {id: S2-T1, speaker: Elias, text: "Guys, bad news, I'm so sorry! The noise filtering is totally stuck!! I need a few clean reference recordings for the noise profile, and the field station still hasn't sent them."}
      - {id: S2-T2, speaker: Zan, text: "Ugh. Maybe we should just drop the filtering and train on the raw clips instead?"}
      - {id: S2-T3, speaker: Noor, text: "Let's... just give the field station until next week before we decide that. It'll be fine!"}
      - {id: S2-T4, speaker: Zan, text: "On my end, I've tagged about 200 clips, but most of the calls are under two seconds, so the clips are mostly silence."}
      - {id: S2-T5, speaker: Zan, text: "Could we cut them shorter? Say, 3 seconds?"}
      - {id: S2-T6, speaker: Noor, text: "Yeah, that makes perfect sense! We'll re-cut everything into 3-second clips. Just a minor detour, no problem."}
      - {id: S2-T7, speaker: Zan, text: "Then I'll put the species tagging on hold until the new clips are cut."}
  - id: S3
    date: 2026-10-13
    turns:
      - {id: S3-T1, speaker: Elias, text: "Amazing news!! The field station sent the reference recordings over the weekend, so I am right back on the noise filtering!! Hope that helps ease things a bit!"}
      - {id: S3-T2, speaker: Noor, text: "Oh, thank goodness! And about the species tagging: the survey sheets already say which species is on every recording. So let's just cancel the hand-tagging and use the survey labels instead. One less thing on our plate!"}
      - {id: S3-T3, speaker: Zan, text: "Fine by me. That saves me from redoing two hundred clips."}
      - {id: S3-T4, speaker: Zan, text: "I'll have the shorter clips on the shared drive by tonight."}
      - {id: S3-T5, speaker: Elias, text: "So cool! I'll run the filter on those immediately, then!"}
  - id: S4
    date: 2026-10-16
    turns:
      - {id: S4-T1, speaker: Elias, text: "The noise filtering is 100% done!! Every clip has been through the filter, and the spectrograms look so much cleaner!!"}
      - {id: S4-T2, speaker: Noor, text: "Amazing work, Elias. Truly."}
      - {id: S4-T3, speaker: Elias, text: "Took long enough! It sat completely stuck for a whole week waiting on those reference recordings, I know that was stressing everyone out!"}
      - {id: S4-T4, speaker: Zan, text: "Great. So the cleaned clips can go straight into training now."}
      - {id: S4-T5, speaker: Elias, text: "Wait, hold on!! About the species tagging: I thought we agreed it was only on hold, not completely cancelled!!"}
      - {id: S4-T6, speaker: Noor, text: "Are you kidding me? I definitely remember us cancelling it... oh my god, I can't deal with this back-and-forth right now. I'll just check the meeting notes tonight to be sure."}
      - {id: S4-T7, speaker: Zan, text: "Okay. Meanwhile, I'll set up the first training run on the cleaned clips."}

script:
  - {turn: S1-T1, act: decide, item: audio.clip_length, value: 5 seconds}
  - {turn: S1-T3, act: task_open, item: task.denoise}
  - {turn: S1-T4, act: task_open, item: task.species_tags}
  - {turn: S2-T1, act: task_progress, item: task.denoise, progress: blocked}
  - {turn: S2-T2, act: suggest, item: task.denoise, value: cancelled}
  - {turn: S2-T5, act: suggest, item: audio.clip_length, value: 3 seconds}
  - {turn: S2-T6, act: accept, item: audio.clip_length, accepts: S2-T5, reason: "most calls are under two seconds, so longer clips are mostly silence"}
  - {turn: S2-T7, act: task_progress, item: task.species_tags, progress: blocked}
  - {turn: S3-T1, act: task_progress, item: task.denoise, progress: open}
  - {turn: S3-T2, act: task_progress, item: task.species_tags, progress: cancelled, reason: "the survey sheets already give the species for every recording"}
  - {turn: S4-T1, act: task_progress, item: task.denoise, progress: completed}
  - {turn: S4-T3, act: mention, item: task.denoise, value: blocked}
  - {turn: S4-T5, act: contest, item: task.species_tags, value: blocked}
  - {turn: S4-T6, act: mention, item: task.species_tags, value: cancelled}

questions:
  - {id: audio.clip_length@S4-previous, after: S4, kind: previous, item: audio.clip_length, text: "Which clip length, if any, did we use before the current one?"}
  - {id: task.denoise@S4-asof-S2, after: S4, kind: as_of, session: S2, item: task.denoise, text: "What was the state of the noise filtering at the end of the second meeting?"}
