# Development scenario. Not yet reviewed by the team.
# Focal pattern: three choices for a lecture-captioning project are each made
# once and later changed with explicit replacement words ("X instead of Y"):
# the recognition model (S2), the audio splitting (S3) and the caption file
# format (S4). No suggestion, dispute or later mention follows a change, so the
# newest statement is always the right answer (a control).
scenario_id: dev-06
title: Lecture captions changed with explicit replacements
category: explicit_revision
split: dev
author: mace2305
review: {status: unreviewed}
project_id: lecture-captions

items:
  - key: model.asr
    kind: decision
    description: speech recognition model that transcribes the lecture recordings
    ask: Which speech-to-text model are we using for the lecture recordings?
    values:
      wav2vec 2.0: [wav2vec2, wav2vec 2, wav2vec2-base]
      Whisper small: [whisper-small, whisper]
  - key: audio.segmentation
    kind: decision
    description: how the lecture audio is cut into pieces before transcription
    ask: How are we splitting the lecture audio before transcribing it?
    values:
      fixed 30-second chunks: [30-second chunks, fixed-length chunks, 30-second windows]
      voice activity detection: [VAD, VAD-based segmentation, silence-based splitting]
  - key: output.format
    kind: decision
    description: file format of the timed captions uploaded to the lecture portal
    ask: Which caption file format are we exporting?
    values:
      SRT: [SubRip, srt file]
      WebVTT: [VTT, web vtt, vtt file]

sessions:
  - id: S1
    date: 2026-10-06
    turns:
      - {id: S1-T1, speaker: Rhea, text: "Okay... goal is captions for the department's recorded lectures. Forty hours of audio to get through. Sigh."}
      - {id: S1-T2, speaker: Felix, text: "For the recognizer, just use wav2vec 2.0. Got a base checkpoint fine-tuned on LibriSpeech already, so can start straight away. Let's just get this over with."}
      - {id: S1-T3, speaker: Dana, text: "Yeah, whatever. Works for me."}
      - {id: S1-T4, speaker: Rhea, text: "The lectures are an hour each... too long to push through at one go. Just cut them into fixed 30-second chunks."}
      - {id: S1-T5, speaker: Dana, text: "I guess I'll hand-correct transcripts for three lectures. Just so we have a baseline."}
      - {id: S1-T6, speaker: Felix, text: "Right. Same time Friday then."}
  - id: S2
    date: 2026-10-09
    turns:
      - {id: S2-T1, speaker: Dana, text: "Reference transcripts for those three lectures are done. Dropped them in the shared folder. That took forever."}
      - {id: S2-T2, speaker: Felix, text: "First pass is done. Word error rate is like 34 percent. And the output got zero punctuation or capitals. Great."}
      - {id: S2-T3, speaker: Dana, text: "It also completely messes up the lecturer's accent and literally every stats term. 'Heteroscedasticity' comes out as four random words. So dumb."}
      - {id: S2-T4, speaker: Rhea, text: "Haiz, like that how to submit... Right, decision: we're switching to Whisper small instead of wav2vec 2.0 lah. It punctuates out of the box and handles the accents way better."}
      - {id: S2-T5, speaker: Felix, text: "Fine lor. I'll just rerun the three lectures over the weekend. Weekend gone."}
      - {id: S2-T6, speaker: Dana, text: "Oh, by the way, the lecture portal needs caption files. Let's just export SRT, it's what everyone uses anyway."}
      - {id: S2-T7, speaker: Rhea, text: "Sure... whatever is easiest."}
  - id: S3
    date: 2026-10-13
    turns:
      - {id: S3-T1, speaker: Felix, text: "The rerun's done. Word error rate down to 14 percent. Punctuation actually looks decent for once."}
      - {id: S3-T2, speaker: Dana, text: "Most of the errors left are right at the cut points, though. Words are literally getting sliced in half every thirty seconds. Annoying."}
      - {id: S3-T3, speaker: Rhea, text: "Aiyah... Okay, then we split on voice activity detection instead of the fixed 30-second chunks, ya? So the cuts land in the pauses."}
      - {id: S3-T4, speaker: Felix, text: "Makes sense. Lecturers pause all the time anyway."}
      - {id: S3-T5, speaker: Dana, text: "Ugh. I'll rewrite the segmentation script tonight, I guess."}
  - id: S4
    date: 2026-10-16
    turns:
      - {id: S4-T1, speaker: Dana, text: "New segments are in. We're at 11 percent on the three reference lectures now. So that's something."}
      - {id: S4-T2, speaker: Felix, text: "Bad news from the portal side. I uploaded a test caption file and the player shows nothing. Turns out it doesn't even read our files at all sia. Waste my time."}
      - {id: S4-T3, speaker: Rhea, text: "Haiz, why always got problem one... Okay, then we export WebVTT instead of SRT from now on lah. The conversion is just a header line and different timestamp format."}
      - {id: S4-T4, speaker: Dana, text: "I can patch the export script today. Whatever."}
      - {id: S4-T5, speaker: Rhea, text: "Great... So for the progress report: Whisper small, split with voice activity detection, captions as WebVTT. Hope nothing else goes wrong."}
      - {id: S4-T6, speaker: Felix, text: "I'll just put the numbers table together."}

script:
  - {turn: S1-T2, act: decide, item: model.asr, value: wav2vec 2.0}
  - {turn: S1-T4, act: decide, item: audio.segmentation, value: fixed 30-second chunks}
  - {turn: S2-T4, act: revise, item: model.asr, value: Whisper small, reason: "wav2vec 2.0 output has no punctuation and struggles with the lecturer's accent"}
  - {turn: S2-T6, act: decide, item: output.format, value: SRT}
  - {turn: S3-T3, act: revise, item: audio.segmentation, value: voice activity detection, reason: "fixed chunks cut words in half at the boundaries"}
  - {turn: S4-T3, act: revise, item: output.format, value: WebVTT, reason: "the lecture portal's player does not read the old caption files"}
  - {turn: S4-T5, act: restate, item: model.asr, value: Whisper small}
  - {turn: S4-T5, act: restate, item: audio.segmentation, value: voice activity detection}
  - {turn: S4-T5, act: restate, item: output.format, value: WebVTT}

questions:
  - {id: model.asr@S3-previous, after: S3, kind: previous, item: model.asr, text: "Which speech-to-text model, if any, did we use for the lecture recordings before the current one?"}
  - {id: audio.segmentation@S4-previous, after: S4, kind: previous, item: audio.segmentation, text: "Which audio-splitting method, if any, did we use for the lecture recordings before the current one?"}
  - {id: output.format@S4-asof-S2, after: S4, kind: as_of, session: S2, item: output.format, text: "What was the state of the caption-format choice at the end of the second meeting?"}
